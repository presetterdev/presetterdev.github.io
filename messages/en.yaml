# Questions, in the order they appear.
faq:
  title: QUESTIONS
  copy:
    question: Does it copy or share presets?
    answer: >-
      No. It reads preset files already on your Mac and writes them into a
      folder on the same Mac. Previews are rendered from your own licensed
      plugins. Nothing is uploaded and nothing is redistributed.
  plugins_needed:
    question: Do I still need the plugins?
    answer: >-
      Yes. A preset is a list of settings; the plugin makes the sound. Presets
      for a plugin you don't have won't load.
  tags:
    question: Where do the tags come from?
    answer: >-
      From the plugin makers. Serum says Pads, Omnisphere says Pads + Strings,
      Kontakt says Synth Pad. Presetter reads each maker's categories and maps
      them onto Live 12's tags, so everything filters the same way.
  load:
    question: What happens when I load one?
    answer: >-
      The plugin loads in your device chain with the preset selected and its
      macros mapped. Tweak it from Live, or open the plugin if you want to go
      deeper.
  plugin:
    question: Is it a plugin? Will it slow Live down?
    answer: >-
      No and no. It's a standalone Mac app you run to build or update the pack.
      Nothing runs inside Live.
  live:
    question: Which versions of Live?
    answer: >-
      Live 12 and newer. The tag filtering uses browser features that arrived in
      12.
  windows:
    question: Windows?
    answer: Not yet. It's planned. Get on the list and we'll tell you.
  effects:
    question: Effects too?
    answer: >-
      Yes. Effect presets get indexed, tagged and previewed like instruments.
  missing:
    question: My plugin isn't on the list.
    answer: >-
      If it's NKS-ready, it works. If it isn't, email us. Requests set the order
      we build in.
  format:
    question: What if a plugin changes its preset format?
    answer: >-
      Run Presetter again. We keep the adapters current as vendors change
      things, and a license includes updates for a year.
  ni:
    question: Do I need Komplete Kontrol or other NI software?
    answer: No. Presetter reads the preset files directly.
  beta:
    question: How does the beta work?
    answer: >-
      It's running now, Mac only, closed. We pick testers from the list to cover
      different plugin collections, so email us what you own. Beta builds come
      with a free license key that expires when the beta ends.
  refunds:
    question: Refunds?
    answer: >-
      All sales are final. The pack stays on your Mac whether or not the app
      does, so there's nothing to give back. Check the plugin list before you
      buy.

