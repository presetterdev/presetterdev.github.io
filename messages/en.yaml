# What Presetter stays out of.
lean:
  points:
    not_plugin: Not a plugin
    no_account: No account
    no_background: Nothing in the background
    one_folder: One folder, delete it any time
  specs: >-
    macOS 11 or newer, Intel or Apple silicon. Ableton Live 12 or newer. VST3
    plugins, installed and licensed on the same Mac. Windows is planned, not
    yet.

# Why it exists. A blank line starts a new paragraph.
origin:
  title: WHY IT EXISTS
  body: >-
    Presetter started as one producer's way into their own library. Years of
    plugins meant thousands of presets, and the only way to hear them was to
    open each plugin in turn. Live's browser could already sort and preview
    sounds; it just didn't know about these. Presetter taught it, and became the
    way its maker finds sounds.

