# The password-gated download page for testers, /beta.
beta:
  title: Presetter beta
  lede: >-
    This page is for invited testers. Enter the password from your invitation to
    download the current build.
  password: Password
  unlock: Unlock
  status:
    checking: Checking…
    fetching: Downloading the build…
    decrypting: Unlocking…
    wrong: That password didn't work. Check your invitation and try again.
    failed: >-
      The download didn't complete. Reload the page and try again; if it keeps
      failing, email support@presetter.audio.
  ready:
    title: Your download is ready.
    body: If it didn't start on its own, use the button.
    button: Download
    file: "{name} · {size} · v{version}"
    sha: "SHA-256 {digest}"
  install:
    title: Installing
    disk_image: Open the disk image and drag Presetter into Applications.
    documents: >-
      Open Presetter. If macOS asks for access to your Documents folder, allow
      it — some plugins keep their presets there.
    key: >-
      Enter the license key from your invitation. It works on one Mac and
      expires on the date in the invitation.
    backup: >-
      Back up your Ableton User Library before building your first pack. This is
      a beta.
    after: >-
      Then follow the five steps on the home page. {#link}How it works{/link}
  agreement: >-
    Downloading means you accept the license agreement, beta terms included.
    {#link}Read the license agreement{/link}

