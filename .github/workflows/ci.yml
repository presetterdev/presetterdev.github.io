name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The build regenerates the route tree; a diff means it was committed
      # stale.
      - run: git diff --exit-code src/routeTree.gen.ts
      # A squash merge makes the title the commit subject on main, so it has
      # to read like one. The title goes through the environment rather than
      # into the script text, where a crafted one would be executed.
      - if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s' "$PR_TITLE" | npx commitlint
      # Every route is prerendered to its own index.html, and the prerender
      # writes a real not-found page to 404.html, which Pages serves for any
      # other address; it hydrates the app, so client-side navigation still
      # works from there.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Each pull request is also deployed to Cloudflare Pages as a preview, at a
  # stable address per pull request (pr-<number>) that the pull request links
  # to as its "preview" deployment. functions/_middleware.ts puts every
  # preview behind one login the team shares. The project, the token and the
  # "preview" environment's contents come from terraform/preview.tf.
  #
  # Pull requests from forks get no secrets, so they get no preview.
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      # Uses the wrangler from package.json. Left to install its own, the
      # action edits package.json, and wrangler then deploys from a checkout
      # it reports as dirty.
      - id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist --project-name=presetter-site-preview
            --branch=pr-${{ github.event.pull_request.number }}
